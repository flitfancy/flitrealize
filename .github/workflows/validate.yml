name: validate

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skill:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Scan committed additions
        env:
          FLITREALIZE_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/scan_staged_secrets.py --range "$FLITREALIZE_BASE_SHA" "$GITHUB_SHA"
      - name: Validate repository
        run: python3 scripts/validate.py
      - name: Run action tests
        run: node scripts/run-tests.mjs
      - name: Run release-tool tests
        run: python3 -m unittest discover -s tests -p "test_*.py"
      - name: Build release artifact
        run: python3 scripts/package_release.py
      - name: Check release consistency
        run: python3 scripts/check_release.py
      - name: Smoke-test clean release ZIP
        run: python3 scripts/smoke_test_release.py
